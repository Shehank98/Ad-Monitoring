{% extends 'base.html' %}
{% block title %}TC PDF Converter{% endblock %}

{% block content %}
<!-- React + PDF.js + SheetJS (client-side only, no server round-trip for parsing) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<div class="max-w-5xl mx-auto px-4 py-6">
  <!-- Page title -->
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
      <span class="bg-blue-600 text-white rounded-lg p-1.5 text-sm">
        <i class="fa-solid fa-file-pdf"></i>
      </span>
      TC PDF Converter
    </h1>
    <p class="text-sm text-slate-500 mt-1">Upload a TV station Transmission Certificate PDF, preview the parsed data, then upload to the system.</p>
  </div>

  <!-- React app mount point -->
  <div id="pdf-converter-root"></div>
</div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const CSRF = '{{ csrf_token }}';
const ACCOUNTS = [
  {% for acc in accounts %}
  { id: '{{ acc.id }}', name: '{{ acc.name|escapejs }}' },
  {% endfor %}
];

const ACTIVE_CHANNELS   = ["Tv - Derana","Tv - Sirasa TV","Tv - Swarnavahini","Tv - ITN","Tv - Vasantham TV","Tv - Hiru TV","Tv - Shakthi TV","Star Tamil","Tv - Siyatha Tv","TV - Supreme TV"];
const DISABLED_CHANNELS = ["Rupavahini","Channel Eye"];

/* ── Channel normalization ─────────────────────────────────────────────────
   The Nova Channel Management system stores channel names with a "Tv - " prefix
   (and inconsistent spacing/spelling). Channel-specific PARSING rules below key
   off canonical names, so every selected channel is normalized once here before
   parsing. Only the parsing logic uses the normalized name — the value sent to
   the server keeps the original (it must match the stored Schedule channel). */
const CHANNEL_MAP = {
  "Tv - Derana":               "TV Derana",
  "Tv - Hiru TV":              "Hiru TV",
  "Tv - Sirasa TV":            "Sirasa TV",
  "Tv - Shakthi TV":           "Shakthi TV",
  "Tv - Siyatha Tv":           "Siyatha TV",
  "TV -Supreme TV":            "Supreme TV",
  "TV - Supreme TV":           "Supreme TV",
  "Tv - ITN":                  "ITN",
  "Tv - Vasantham TV":         "Vasantham TV",
  "Tv - Swarnavahini":         "Swarnawahini TV",
  "Tv - Channel Eye - Nethra": "Channel Eye",
  "Tv - Rupavahini":           "Rupavahini",
};
function normalizeChannel(name) {
  if (!name) return name;
  if (CHANNEL_MAP[name]) return CHANNEL_MAP[name];
  const collapsed = String(name).replace(/\s+/g, ' ').trim();   // tolerate spacing
  return CHANNEL_MAP[collapsed] || name;
}

/* ── Icons ─────────────────────────────────────────────────────── */
const Ico = ({ d, size=16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>
  </svg>
);
const IcoZap      = ({size=16}) => <Ico size={size} d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>;
const IcoDownload = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
const IcoX        = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const IcoCheck    = ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const IcoUpload   = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;

/* ── PDF heuristic parser ─────────────────────────────────────────────────── */
async function parsePDF(file, selectedChannel) {
  // Normalize once so channel-specific parsing rules fire regardless of the
  // Nova-prefixed name that was selected.
  const normalizedChannel = normalizeChannel(selectedChannel);
  console.log("Selected Channel:", selectedChannel);
  console.log("Normalized Channel:", normalizedChannel);

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const extractedRows = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const items = textContent.items;

    items.sort((a, b) => {
      const yDiff = b.transform[5] - a.transform[5];
      if (Math.abs(yDiff) > 5) return yDiff;
      return a.transform[4] - b.transform[4];
    });

    let currentLine = [], currentY = null, lastEndX = null;
    items.forEach(item => {
      const y = item.transform[5], x = item.transform[4];
      let str = item.str;
      if (normalizedChannel === 'Supreme TV') str = str.replace(/\$/g, '');
      if (!str.trim()) return;
      const charWidth = item.width / Math.max(1, str.length);
      const parts = str.split(/(\s{2,})/);
      let cursorX = x;
      parts.forEach(part => {
        if (part.trim() === '') { cursorX += part.length * charWidth; return; }
        const chunkX = cursorX, text = part.trim(), chunkWidth = text.length * charWidth;
        cursorX += part.length * charWidth;
        if (currentY === null || Math.abs(currentY - y) > 5) {
          if (currentLine.length > 0) extractedRows.push(currentLine);
          currentLine = [{ text, x: chunkX, endX: chunkX + chunkWidth }];
          currentY = y; lastEndX = chunkX + chunkWidth;
        } else {
          const gap = chunkX - lastEndX;
          if (gap > 4) {
            currentLine.push({ text, x: chunkX, endX: chunkX + chunkWidth });
          } else {
            const addSpace = (gap > 1.5 && !currentLine[currentLine.length-1].text.endsWith(' ')) ? ' ' : '';
            currentLine[currentLine.length-1].text += addSpace + text;
            currentLine[currentLine.length-1].endX = chunkX + chunkWidth;
          }
          lastEndX = currentLine[currentLine.length-1].endX;
        }
      });
    });
    if (currentLine.length > 0) extractedRows.push(currentLine);
  }

  const SKIP_RE = /\b(VAT No|Invoice No|Invoice Details|Date\s*:|From\s*:|To\s*:|Contractor Number|Contract No|Schedule No|Client\s*:|Agent\s*:|Ref No|Client Code|Agent Code|Total Value|Certified By|Checked By|Prepared By|POWER HOUSE|UNLESS OBJECTIONS|Page \d+(?: of \d+)?|Prog\. Date|Caption\/Copy Title|Duration \(sec\)|Channel\s*:|Sr\.No\.|MTV Channel|Braybrooke|TELECAST CERTIFICATE|Advertiser\s*:|Address\s*:|Telecast Certificate dt|Campaign Period|Account Executive|Marketing Executive|Co\/Agency|Release Order Ref|Traffic Order No|Reg No\.|Brand\s*:|TOTAL SPOTS|AUTHORISED SIGNATORY|System Generated|Digitally Signed|Day Time|Duration Lan Mat|Cut No|Product Details|Posi|Position|Net Rate|Remarks|Bill Number|Booking Number|Deal Number|Agency Reference No|Total Spot|We certify the commercials|Net Rate 1|Agency Name|Printed Date|Printed Time|Printed By|Client Name|Agent Name|Client \/ Contract Debits|Asia Broadcasting|TELECAST T\/BELT|PRODUCT|DURA\.?|Gross Value|Net Value|Agency Comm|Sub Total|Total Amount|Taxes|SSCL|E\s*&\s*O\.?\s*E|Errors\s*&\s*Omissions|For MTV|Telecast Summary|Campaign Summary|Total Cost|Payment Terms|Certificate of Transmission|Voice of Asia|This is a computer generated|Transmission certificate|no signature is required|J Lanka Group Of Companies|Authorized Signature|TC_TIME|Supreme TV|Actual time|Time Belt|Time\s*Programme\s*Date|Programme\s*Date)\b/i;
  const HEADER_RE = /^(DATE|PROGRAMME|TIME|POSI|POSITION|PRODUCT|DURA\.?|TELECAST(?: T\/BELT)?|TC_TIME|REMARKS|DURATION|ACTUAL TIME|TIME BELT|\s)+$/i;
  // Supports numeric dates (1-2 digit parts, 2-4 digit year) and text-month dates (e.g. 1-Apr-26, 09/Mar/26)
  const DATE_RE = /(\d{1,2}[-/]\d{1,2}[-/]\d{2,4}|\d{1,2}[-/][a-zA-Z]{3}[-/]\d{2,4})/;

  const extractedRecords = [];
  extractedRows.forEach(line => {
    const textLine = line.map(i => i.text).join(' ');
    if (SKIP_RE.test(textLine) || /Rs\s*:/i.test(textLine) || /\.{4,}/.test(textLine) ||
        /^\s*(Rs\.?\s*:?\s*)?[\d,]+\.\d{2}\s*$/i.test(textLine) ||
        HEADER_RE.test(textLine.trim()) || /^- PAGE -\s*\d+$/i.test(textLine.trim())) return;
    const dateMatch = textLine.match(DATE_RE);
    if (dateMatch) {
      extractedRecords.push({ mainLine: line, allItems: [...line] });
    } else if (extractedRecords.length > 0 && textLine.length > 2) {
      extractedRecords[extractedRecords.length-1].allItems.push(...line);
    }
  });

  const parsedData = [];
  const MONTH_MAP = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  // Matches HH:MM:SS (24h) and H:MM AM/PM (12h)
  const TIME_RE = /(\d{1,2}[:.]\d{2}[:.]\d{2}(?:[:.\d]*)|\d{1,2}[:.]\d{2}\s*[APMampm]{2})/g;

  extractedRecords.forEach(record => {
    const mainText = record.mainLine.map(i => i.text).join(' ');
    const allText  = record.allItems.map(i => i.text).join(' ');
    const dateMatch = mainText.match(DATE_RE);
    if (!dateMatch) return;

    const allTimes = [...allText.matchAll(TIME_RE)].map(m => m[1]);
    if (!allTimes.length) return;

    // ── Date parsing ──────────────────────────────────────────────────────
    const rawDate = dateMatch[1];
    let date = '';
    if (/[a-zA-Z]{3}/.test(rawDate)) {
      // Text-month format: "1-Apr-26" or "09/Mar/26" → output D/M/YYYY for server
      const parts = rawDate.split(/[-/]/);
      const month = MONTH_MAP[parts[1].toLowerCase()] || 1;
      let year = parts[2]; if (year.length === 2) year = '20' + year;
      date = `${parseInt(parts[0],10)}/${month}/${year}`;
    } else {
      const parts = rawDate.split(/[-/]/);
      let year = parts[2]; if (year.length === 2) year = '20' + year;
      if (normalizedChannel === 'Supreme TV') {
        // Supreme TV PDFs use MM/DD/YYYY
        date = `${parseInt(parts[1],10)}/${parseInt(parts[0],10)}/${year}`;
      } else {
        // All other channels use DD/MM/YYYY → send as D/M/YYYY to server
        date = `${parseInt(parts[0],10)}/${parseInt(parts[1],10)}/${year}`;
      }
    }

    // ── Time & duration extraction ─────────────────────────────────────────
    let time = '', duration = '';
    let durationTime, advtTime;

    if (normalizedChannel === 'Supreme TV') {
      durationTime = allTimes.find(t => t.startsWith('0:00:'));
      advtTime     = allTimes.find(t => !t.startsWith('0:00:')) || allTimes[0];
    } else {
      durationTime = allTimes.find(t => t.startsWith('00:00:'));
      if (normalizedChannel === 'Star Tamil' || normalizedChannel === 'Siyatha TV') {
        // Prefer actual HH:MM:SS over scheduled AM/PM time
        advtTime = allTimes.find(t => /\d{2}[:.]\d{2}[:.]\d{2}/.test(t) && !t.startsWith('00:00:'))
                || allTimes.find(t => /[AP]M/i.test(t))
                || allTimes.find(t => !t.startsWith('00:00:'))
                || allTimes[0];
      } else {
        advtTime = allTimes.find(t => !t.startsWith('00:00:')) || allTimes[0];
      }
    }

    if (advtTime) {
      if (/[AP]M/i.test(advtTime)) {
        const m = advtTime.match(/(\d{1,2})[:.](\d{2})\s*([AP]M)/i);
        if (m) {
          let h = parseInt(m[1],10);
          if (m[3].toUpperCase() === 'PM' && h < 12) h += 12;
          if (m[3].toUpperCase() === 'AM' && h === 12) h = 0;
          time = `${h.toString().padStart(2,'0')}:${m[2]}:00`;
        } else { time = advtTime; }
      } else {
        time = advtTime.substring(0, 8);
      }
    }

    if (durationTime) {
      if (normalizedChannel === 'Supreme TV') {
        duration = parseInt(durationTime.replace('0:00:',''), 10).toString();
      } else {
        duration = durationTime.substring(0, 8).replace('00:00:','');
      }
    } else {
      const ti = allText.search(/\b\d{2}:\d{2}:\d{2}/);
      if (ti > 0) {
        const lw = allText.substring(0,ti).trim().match(/\b(\d+)\b$/);
        if (lw && ['5','10','15','20','25','30','45','60'].includes(lw[1])) duration = lw[1];
      }
      if (!duration) {
        const dm = allText.match(/\b(\d{2})\b(?=\s*$)/) || allText.match(/\b(10|15|20|25|30)\b/);
        if (dm) duration = dm[1];
      }
    }

    // ── Filter noise words ────────────────────────────────────────────────
    const remainingItems = [];
    record.allItems.forEach(item => {
      let c = item.text.trim();
      if (!c || c.length <= 1) return;
      if (/^\d{1,4}$/.test(c) && item.x < 50) return;
      if (/^(ITNCOMM|VTVCOMM|ITNOPCL)\w+$/i.test(c) || /^\d{5,}$/.test(c)) return;
      if (c === String(duration) || (durationTime && c === durationTime)) return;
      c = c.replace(rawDate, '').trim();
      c = c.replace(/\d{1,2}[:.]\d{2}[:.]\d{2}(?:[:.\d]*)/g, '').trim();
      c = c.replace(/\d{1,2}[:.]\d{2}\s*[APMampm]{2}/gi, '').trim();
      c = c.replace(/\d{2}[:.]\d{2}(?:[:.]\d{2})?\s*-\s*\d{2}[:.]\d{2}(?:[:.]\d{2})?/g, '').trim();
      c = c.replace(/\b(CB|FCT|SPO)\b/gi, '').trim();
      c = c.replace(/Certificate of Transmission/gi,'').replace(/Voice of Asia(?: Network)?(?:\s*\(Pvt\)\s*Ltd\.?)?/gi,'').trim();
      c = c.replace(/This is a computer generated.*?$/gi,'').replace(/Transmission certificate.*?$/gi,'').trim();
      c = c.replace(/Page\s*\d+/gi,'').replace(/J Lanka Group Of Companies/gi,'').trim();
      c = c.replace(/Actual time/gi,'').replace(/Time Belt/gi,'').trim();
      if (!c || c.length <= 1) return;
      if (/^(Mon|Tue|Wed|We|Thu|Fri|Sat|Sun|BS|PO|PD|OTHERS|Rs\.?:?|[STE]|AM|PM)$/i.test(c)) return;
      if (HEADER_RE.test(c) || /^CB\s*\d*$/i.test(c) || /^[\d,]+\.\d+$/.test(c) || /^\.+$/.test(c)) return;
      remainingItems.push({ ...item, text: c });
    });

    // ── Split Programme vs Theme via largest horizontal gap ───────────────
    let program = '', commercial = '';
    if (normalizedChannel === 'Supreme TV') {
      commercial = remainingItems.map(i => i.text).join(' ').trim();
    } else if (remainingItems.length > 0) {
      const sorted = [...remainingItems].sort((a,b) => a.x - b.x);
      let maxGap = 0, splitIdx = -1;
      for (let i = 0; i < sorted.length-1; i++) {
        const gap = sorted[i+1].x - sorted[i].endX;
        if (gap > maxGap) { maxGap = gap; splitIdx = i; }
      }
      const threshold = (maxGap > 4 && splitIdx >= 0) ? sorted[splitIdx].endX + maxGap/2 : 9999;
      const progParts = [], commParts = [];
      remainingItems.forEach(item => {
        if (item.x >= threshold) { commParts.push(item.text); return; }
        const crossed = threshold !== 9999 && item.endX > threshold + 5;
        const sm = item.text.match(/^(.*?)\s+-\s*(.*)$/);
        if (sm && (threshold === 9999 || crossed) && sm[1].trim().length > 2 && sm[2].trim().length > 2) {
          progParts.push(sm[1].trim()); commParts.push(sm[2].trim());
        } else { progParts.push(item.text); }
      });
      program    = progParts.join(' ').trim().replace(/-$/, '').trim();
      commercial = commParts.join(' ').trim().replace(/^-/, '').trim();
      if (program && !commercial) {
        const sm = program.match(/^(.*?)\s+-\s*(.*)$/);
        if (sm && sm[1].trim().length > 2) { program = sm[1].trim(); commercial = sm[2].trim(); }
      } else if (!program && commercial) {
        const sm = commercial.match(/^(.*?)\s+-\s*(.*)$/);
        if (sm && sm[1].trim().length > 2) { program = sm[1].trim(); commercial = sm[2].trim(); }
      }
      if (duration && commercial.endsWith(duration)) commercial = commercial.slice(0, -duration.length).trim();
    }

    if (program || commercial) {
      parsedData.push({
        DATE:       date,
        PROGRAMME:  normalizedChannel === 'Supreme TV' ? 'N/A' : program.trim(),
        Advt_time:  time,
        Advt_theme: commercial.trim(),
        Duration:   duration,
      });
    }
  });
  return parsedData;
}

/* ── Main App ───────────────────────────────────────────────────── */
function App() {
  const [accountId,      setAccountId]      = useState(ACCOUNTS.length ? ACCOUNTS[0].id : '');
  const [selectedChannel,setSelectedChannel] = useState('Tv - Derana');
  const [file,           setFile]           = useState(null);
  const [isConverting,   setIsConverting]   = useState(false);
  const [isUploading,    setIsUploading]    = useState(false);
  const [rows,           setRows]           = useState([]);
  const [errorMsg,       setErrorMsg]       = useState('');
  const [uploadResult,   setUploadResult]   = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  }, []);

  const handleFile = (f) => {
    if (!f) return;
    if (f.type !== 'application/pdf') { setErrorMsg('Please upload a valid PDF file.'); return; }
    setFile(f); setRows([]); setErrorMsg(''); setUploadResult(null);
  };

  const convert = async () => {
    if (!file) return;
    setIsConverting(true); setErrorMsg('');
    try {
      const data = await parsePDF(file, selectedChannel);
      if (!data.length) { setErrorMsg('Could not find tabular data. Check the PDF is a valid TC.'); }
      else setRows(data);
    } catch(e) { setErrorMsg('Error reading PDF: ' + e.message); }
    setIsConverting(false);
  };

  const downloadExcel = () => {
    if (!rows.length) return;
    const ws = window.XLSX.utils.json_to_sheet(rows);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'TC Data');
    window.XLSX.writeFile(wb, `${selectedChannel}_TC_Converted.xlsx`);
  };

  const uploadToSystem = async () => {
    if (!rows.length || !accountId) return;
    setIsUploading(true); setErrorMsg('');
    try {
      const res = await fetch('{% url "tc_pdf_convert" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
        body: JSON.stringify({ account_id: accountId, channel: selectedChannel, rows }),
      });
      const data = await res.json();
      if (!data.ok) { setErrorMsg(data.error || 'Upload failed.'); }
      else setUploadResult(data);
    } catch(e) { setErrorMsg('Network error: ' + e.message); }
    setIsUploading(false);
  };

  /* ── Pill button ─────────────────────────────────────────────── */
  const ChannelBtn = ({ ch, disabled=false }) => (
    <button
      onClick={() => { if(!disabled){ setSelectedChannel(ch); setRows([]); setUploadResult(null); }}}
      disabled={disabled}
      className={`relative px-2 py-3 rounded-lg text-xs font-bold border transition-all flex items-center justify-center text-center
        ${disabled ? 'bg-gray-50 text-gray-300 border-gray-100 cursor-not-allowed'
          : selectedChannel===ch
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
            : 'bg-white text-gray-700 border-gray-200 hover:border-blue-300'}`}
    >
      {ch}
      {selectedChannel===ch && !disabled && (
        <span className="absolute -top-1.5 -right-1.5 bg-white text-blue-600 rounded-full p-0.5 shadow border border-gray-100">
          <IcoCheck />
        </span>
      )}
    </button>
  );

  return (
    <div className="space-y-5">

      {/* ── Account + Channel ─────────────────────────────────── */}
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
        <h2 className="text-sm font-bold text-slate-700 mb-3">1. Select Account &amp; Channel</h2>
        <div className="mb-4">
          <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1 block">Account</label>
          <select
            value={accountId}
            onChange={e => setAccountId(e.target.value)}
            className="select-field w-full max-w-xs"
          >
            {ACCOUNTS.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        </div>
        <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2 block">Channel</label>
        <div className="grid grid-cols-5 gap-2 mb-2">
          {ACTIVE_CHANNELS.map(ch => <ChannelBtn key={ch} ch={ch} />)}
        </div>
        <div className="grid grid-cols-5 gap-2">
          {DISABLED_CHANNELS.map(ch => <ChannelBtn key={ch} ch={ch} disabled />)}
        </div>
      </div>

      {/* ── Upload & Convert ──────────────────────────────────── */}
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
        <h2 className="text-sm font-bold text-slate-700 mb-1">2. Upload TC PDF</h2>
        <p className="text-xs text-slate-400 mb-4">Upload your <strong>{selectedChannel}</strong> Transmission Certificate</p>

        <div
          className={`border-2 border-dashed rounded-xl p-8 flex flex-col items-center transition-colors
            ${file ? 'border-blue-200 bg-blue-50/40' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'}`}
          onDragOver={e => e.preventDefault()}
          onDrop={e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}
        >
          {file ? (
            <div className="bg-white px-4 py-3 rounded-xl flex items-center gap-4 shadow-sm border border-blue-100 min-w-72">
              <div className="bg-blue-50 p-2 rounded-lg text-blue-600">
                <i className="fa-solid fa-file-pdf text-lg"></i>
              </div>
              <div className="flex-1 text-left">
                <p className="text-sm font-semibold text-slate-800 truncate w-48">{file.name}</p>
                <p className="text-xs text-slate-400">{(file.size/1024).toFixed(1)} KB</p>
              </div>
              <button onClick={() => { setFile(null); setRows([]); setUploadResult(null); }}
                      className="text-slate-400 hover:text-slate-700"><IcoX /></button>
            </div>
          ) : (
            <div className="text-center py-4">
              <i className="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-3 block"></i>
              <p className="text-sm text-slate-500">
                Drag & drop PDF or{' '}
                <label className="text-blue-600 font-semibold cursor-pointer hover:underline">
                  browse
                  <input type="file" className="hidden" accept=".pdf" ref={fileInputRef}
                         onChange={e => handleFile(e.target.files[0])} />
                </label>
              </p>
            </div>
          )}
        </div>

        {errorMsg && <p className="text-red-500 text-xs mt-3 font-medium">{errorMsg}</p>}

        <button
          onClick={convert}
          disabled={!file || isConverting}
          className="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 disabled:opacity-40 transition-colors"
        >
          <IcoZap size={15}/> {isConverting ? 'Converting…' : 'Convert PDF'}
        </button>
      </div>

      {/* ── Preview + actions ─────────────────────────────────── */}
      {rows.length > 0 && !uploadResult && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h2 className="text-sm font-bold text-slate-700 mb-1">3. Preview &amp; Upload</h2>
              <span className="bg-blue-50 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full">
                {rows.length} rows converted
              </span>
            </div>
            <div className="flex gap-2">
              <button onClick={downloadExcel}
                      className="flex items-center gap-1.5 text-xs font-semibold text-slate-600 border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors">
                <IcoDownload size={14}/> Download Excel
              </button>
              <button
                onClick={uploadToSystem}
                disabled={isUploading || !accountId}
                className="flex items-center gap-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg disabled:opacity-40 transition-colors"
              >
                <IcoUpload size={14}/> {isUploading ? 'Uploading…' : 'Upload to System'}
              </button>
            </div>
          </div>

          <div className="overflow-x-auto rounded-lg border border-slate-100 max-h-96">
            <table className="w-full text-xs text-left">
              <thead className="bg-slate-50 sticky top-0 text-slate-600 uppercase font-bold">
                <tr>
                  <th className="px-4 py-2 border-b border-slate-200">Date</th>
                  <th className="px-4 py-2 border-b border-slate-200">Programme</th>
                  <th className="px-4 py-2 border-b border-slate-200 whitespace-nowrap">Aired Time</th>
                  <th className="px-4 py-2 border-b border-slate-200">Advt Theme</th>
                  <th className="px-4 py-2 border-b border-slate-200 text-center">Dur (s)</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i) => (
                  <tr key={i} className="border-b last:border-0 hover:bg-slate-50 transition-colors">
                    <td className="px-4 py-2 whitespace-nowrap text-slate-600">{r.DATE}</td>
                    <td className="px-4 py-2 text-slate-700">{r.PROGRAMME}</td>
                    <td className="px-4 py-2 whitespace-nowrap text-slate-600">{r.Advt_time}</td>
                    <td className="px-4 py-2 text-slate-800 font-medium">{r.Advt_theme}</td>
                    <td className="px-4 py-2 text-center text-slate-600">{r.Duration}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── Upload success + summary ───────────────────────────── */}
      {uploadResult && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <div className="flex items-center gap-3 mb-4 p-3 bg-emerald-50 border border-emerald-100 rounded-xl">
            <span className="text-emerald-600 text-xl"><i className="fa-solid fa-circle-check"></i></span>
            <div>
              <p className="text-sm font-bold text-emerald-800">Uploaded successfully</p>
              <p className="text-xs text-emerald-600">
                {uploadResult.row_count} rows saved · {uploadResult.month} · {selectedChannel}
              </p>
            </div>
            <a href="/dashboard/tc/" className="ml-auto text-xs text-blue-600 hover:underline font-semibold flex items-center gap-1">
              View TC List <i className="fa-solid fa-arrow-right text-[10px]"></i>
            </a>
          </div>

          {/* Summary table: theme × duration */}
          <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">
            <i className="fa-solid fa-table-cells-large mr-1"></i> Summary - Theme × Duration
          </h3>
          <div className="overflow-x-auto rounded-lg border border-slate-100">
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-600 uppercase font-bold">
                <tr>
                  <th className="px-4 py-2 border-b border-slate-200 text-left">Advt Theme</th>
                  <th className="px-4 py-2 border-b border-slate-200 text-center">Duration (s)</th>
                  <th className="px-4 py-2 border-b border-slate-200 text-center">Count</th>
                </tr>
              </thead>
              <tbody>
                {uploadResult.summary.map((s,i) => (
                  <tr key={i} className="border-b last:border-0 hover:bg-slate-50">
                    <td className="px-4 py-2 font-medium text-slate-800">{s.theme}</td>
                    <td className="px-4 py-2 text-center text-slate-600">{s.duration ?? '-'}</td>
                    <td className="px-4 py-2 text-center">
                      <span className="bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded-full">{s.count}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <button
            onClick={() => { setRows([]); setFile(null); setUploadResult(null); }}
            className="mt-4 text-xs text-slate-500 hover:text-slate-700 underline"
          >
            Convert another file
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('pdf-converter-root'));
root.render(<App />);
</script>
{% endblock %}
